<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/header :: head">
        <title>Pesanan Saya - FarmFresh Market</title>
    </div>
</head>
<body>
    <div th:replace="fragments/header :: header"></div>
    
    <main class="main-content">
        <div class="container">
            <h1 class="page-title">Pesanan Saya</h1>
            
            <div th:if="${orders != null and !orders.empty}">
                <div class="orders-container">
                    <div class="order-filters">
                        <a th:href="@{/orders/my-orders}" th:classappend="${param.status == null} ? 'active' : ''"
                           class="filter-btn">Semua</a>
                        <a th:href="@{/orders/my-orders(status='PENDING')}" th:classappend="${param.status == 'PENDING'} ? 'active' : ''"
                           class="filter-btn">Pending</a>
                        <a th:href="@{/orders/my-orders(status='PROCESSED')}" th:classappend="${param.status == 'PROCESSED'} ? 'active' : ''"
                           class="filter-btn">Diproses</a>
                        <a th:href="@{/orders/my-orders(status='SHIPPED')}" th:classappend="${param.status == 'SHIPPED'} ? 'active' : ''"
                           class="filter-btn">Dikirim</a>
                        <a th:href="@{/orders/my-orders(status='DELIVERED')}" th:classappend="${param.status == 'DELIVERED'} ? 'active' : ''"
                           class="filter-btn">Selesai</a>
                    </div>
                    
                    <div class="orders-list">
                        <div th:each="order : ${orders}" class="order-card">
                            <div class="order-header">
                                <div class="order-id">
                                    <strong>Pesanan #<span th:text="${order.id}"></span></strong>
                                    <span th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy')}"></span>
                                </div>
                                <div th:classappend="'status status-' + ${#strings.toLowerCase(order.status)}"
                                    class="status" th:text="${order.status}"></div>
                            </div>
                            
                            <div class="order-details">
                                <div class="order-items">
                                    <div th:each="item : ${order.items}" class="order-item">
                                        <span th:text="${item.product != null ? item.product.name : 'Produk'}"></span>
                                        <span th:text="${item.quantity} + ' x Rp ' + ${#numbers.formatDecimal(item.priceAtTime, 0, 'COMMA', 0, 'POINT')}"></span>
                                    </div>
                                </div>
                                
                                <div class="order-summary">
                                    <div class="summary-row">
                                        <span>Total Pesanan:</span>
                                        <span th:text="'Rp ' + ${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')}"></span>
                                    </div>
                                    <div class="summary-row">
                                        <span>Alamat:</span>
                                        <span th:text="${order.shippingAddress}"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="order-actions">

                            <!-- DETAIL -->
                            <a th:href="@{/orders/{id}/detail(id=${order.id})}"
                            class="btn btn-outline btn-sm btn-detail">
                                <i class="fas fa-eye"></i> Detail
                            </a>

                            <!-- BATALKAN (CUSTOMER, PENDING) -->
                            <a th:if="${order.status == 'PENDING'}"
                            th:href="@{/orders/{id}/cancel(id=${order.id})}"
                            class="btn btn-secondary btn-sm btn-cancel"
                            onclick="return confirm('Batalkan pesanan?')">
                                ✖ Batalkan
                            </a>

                            <!-- PESANAN DITERIMA (CUSTOMER, SHIPPED) -->
                            <form th:if="${order.status == 'SHIPPED'}"
                                th:action="@{/orders/{id}/complete(id=${order.id})}"
                                method="post"
                                class="inline-form">
                                <button type="submit"
                                        class="btn btn-primary btn-sm btn-complete">
                                    ✓ Pesanan Diterima
                                </button>
                            </form>

                        </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div th:if="${orders == null or orders.empty}" class="empty-state">
                <i class="fas fa-clipboard-list fa-3x"></i>
                <h3>Belum Ada Pesanan</h3>
                <p>Anda belum melakukan pemesanan apapun</p>
                <a th:href="@{/}" class="btn btn-primary">
                    <i class="fas fa-store"></i> Mulai Belanja
                </a>
            </div>
        </div>
    </main>
    
    <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
