<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="fragments/header :: head">
        <title>Register - FarmFresh Market</title>
    </div>
</head>
<body>
    <div th:replace="fragments/header :: header"></div>
    
    <main class="main-content">
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <h2 class="auth-title">Daftar Akun Baru</h2>
                    
                    <div th:if="${error}" class="alert alert-error">
                        <i class="fas fa-exclamation-circle"></i>
                        <span th:text="${error}"></span>
                    </div>
                    
                    <div th:if="${success}" class="alert alert-success">
                        <i class="fas fa-check-circle"></i>
                        <span th:text="${success}"></span>
                    </div>
                    
                    <form th:action="@{/register}" method="post" class="auth-form">
                        <div class="form-group">
                            <label for="username">
                                <i class="fas fa-user"></i> Username *
                            </label>
                            <input type="text" id="username" name="username" required 
                                   class="form-control" placeholder="Masukkan username">
                        </div>
                        
                        <div class="form-group">
                            <label for="email">
                                <i class="fas fa-envelope"></i> Email *
                            </label>
                            <input type="email" id="email" name="email" required 
                                   class="form-control" placeholder="Masukkan email">
                        </div>
                        
                        <div class="form-group">
                            <label for="password">
                                <i class="fas fa-lock"></i> Password *
                            </label>
                            <input type="password" id="password" name="password" required 
                                   class="form-control" placeholder="Masukkan password">
                        </div>
                        
                        <div class="form-group">
                            <label for="fullName">
                                <i class="fas fa-id-card"></i> Nama Lengkap *
                            </label>
                            <input type="text" id="fullName" name="fullName" required 
                                   class="form-control" placeholder="Masukkan nama lengkap">
                        </div>
                        
                        <div class="form-group">
                            <label for="role">
                                <i class="fas fa-user-tag"></i> Daftar sebagai *
                            </label>
                            <select id="role" name="role" required class="form-control">
                                <option value="">Pilih peran</option>
                                <option value="CUSTOMER">Pelanggan</option>
                                <option value="FARMER">Petani</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="address">
                                <i class="fas fa-map-marker-alt"></i> Alamat
                            </label>
                            <textarea id="address" name="address" 
                                     class="form-control" rows="3" 
                                     placeholder="Masukkan alamat lengkap"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="phone">
                                <i class="fas fa-phone"></i> No. Telepon
                            </label>
                            <input type="tel" id="phone" name="phone" 
                                   class="form-control" placeholder="Masukkan nomor telepon">
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-user-plus"></i> Daftar
                        </button>
                    </form>
                    
                    <div class="auth-footer">
                        <p>Sudah punya akun? 
                            <a th:href="@{/login}" class="auth-link">Login disini</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
