<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 500 - FarmFresh Market</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <div class="error-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h1 class="error-title">500</h1>
            <h2 class="error-subtitle">Terjadi Kesalahan Server</h2>
            <p class="error-message">
                Maaf, terjadi kesalahan pada server kami. Tim teknis telah diberitahu dan sedang memperbaiki masalah ini.
            </p>
            <div class="error-actions">
                <a th:href="@{/}" class="btn btn-primary">
                    <i class="fas fa-home"></i> Kembali ke Beranda
                </a>
                <button onclick="window.location.reload()" class="btn btn-outline">
                    <i class="fas fa-redo"></i> Coba Lagi
                </button>
            </div>
            <div class="error-help">
                <p>Jika masalah berlanjut, silakan hubungi customer service:</p>
                <p><i class="fas fa-phone"></i> 021-1234-5678</p>
                <p><i class="fas fa-envelope"></i> support@farmfreshmarket.com</p>
            </div>
        </div>
    </div>

    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            padding: 20px;
        }
        
        .error-content {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        
        .error-icon {
            font-size: 80px;
            color: #f39c12;
            margin-bottom: 20px;
        }
        
        .error-title {
            font-size: 120px;
            color: #e74c3c;
            margin: 0;
            line-height: 1;
        }
        
        .error-subtitle {
            color: #2c3e50;
            margin: 10px 0 20px;
        }
        
        .error-message {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 18px;
            line-height: 1.6;
        }
        
        .error-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .error-help {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #7f8c8d;
        }
        
        .error-help p {
            margin: 5px 0;
        }
        
        .error-help i {
            color: #27ae60;
            margin-right: 10px;
        }
        
        @media (max-width: 576px) {
            .error-content {
                padding: 40px 20px;
            }
            
            .error-title {
                font-size: 80px;
            }
            
            .error-actions {
                flex-direction: column;
            }
        }
    </style>
</body>
</html>
