# ============================================================
# SPRING BOOT CONFIGURATION - FARMFRESH E-COMMERCE
# ============================================================

# SERVER CONFIGURATION
server.port=8080
server.servlet.context-path=/farmfresh
server.error.whitelabel.enabled=false
server.error.path=/error

# APPLICATION INFO
spring.application.name=FarmFresh Market
spring.mvc.favicon.enabled=false

# DATABASE CONFIGURATION (MYSQL)
spring.datasource.url=jdbc:mysql://localhost:3306/farmfresh?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JPA / HIBERNATE CONFIGURATION
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# AUTO CREATE TABEL dari Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.default_batch_fetch_size=10

# LOAD SQL SCRIPTS

# Selalu jalanin script SQL
spring.sql.init.mode=never
# CREATE TABEL
spring.sql.init.schema-locations=classpath:schema.sql  
# INSERT DATA
spring.sql.init.data-locations=classpath:data.sql      
# Lanjut walau ada error
spring.sql.init.continue-on-error=true 
# THYMELEAF CONFIGURATION
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML5
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.enabled=true
spring.thymeleaf.check-template-location=true

# MULTIPART FILE UPLOAD
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# LOGGING CONFIGURATION
logging.level.root=WARN
logging.level.com.farmfresh=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs/farmfresh.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# SESSION MANAGEMENT
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.max-age=1800
spring.session.store-type=none

# CUSTOM APPLICATION PROPERTIES
app.name=FarmFresh Market
app.version=1.0.0
app.description=E-Commerce Sayur Segar dari Petani
app.base-url=http://localhost:8080/farmfresh